        ];

        const generos = [...new Set(JOGOS.map(j => j.genero.split('/')[0]))].sort();
        let filtroAtivo = null;
        const selecionados = new Set();
        let jogosFiltrados = JOGOS;

        function renderGeneros() {
            const container = document.getElementById('controles');
            container.innerHTML = '<button class="btn-genero ativo" data-genero="todos">Todos</button>';
            generos.forEach(g => {
                const btn = document.createElement('button');
                btn.className = 'btn-genero';
                btn.textContent = g;
                btn.dataset.genero = g;
                btn.addEventListener('click', () => filtrar(g));
                container.appendChild(btn);
            });
            document.querySelector('[data-genero="todos"]').addEventListener('click', () => filtrar(null));
        }

        function filtrar(genero) {
            filtroAtivo = genero;
            document.querySelectorAll('.btn-genero').forEach(b => b.classList.remove('ativo'));
            document.querySelector(`[data-genero="${genero || 'todos'}"]`).classList.add('ativo');
            aplicarFiltros();
        }

        function buscar(termo) {
            const busca = termo.toLowerCase();
            aplicarFiltros(busca);
        }

        function aplicarFiltros(termo = '') {
            jogosFiltrados = JOGOS.filter(jogo => {
                const passaGenero = !filtroAtivo || jogo.genero.includes(filtroAtivo);
                const passaBusca = !termo || jogo.titulo.toLowerCase().includes(termo);
                return passaGenero && passaBusca;
            });
            renderJogos();
        }

        function renderJogos() {
            const container = document.getElementById('listaJogos');
            const semResultados = document.getElementById('semResultados');

            if (jogosFiltrados.length === 0) {
                container.innerHTML = '';
                semResultados.style.display = 'block';
                return;
            }

            semResultados.style.display = 'none';
            container.innerHTML = jogosFiltrados.map((jogo, idx) => `
                <div class="jogo">
                    <input type="checkbox" id="jogo-${idx}" data-titulo="${jogo.titulo}" ${selecionados.has(jogo.titulo) ? 'checked' : ''}>
                    <label for="jogo-${idx}" style="cursor: pointer; flex: 1;">
                        <div class="jogo-titulo">${jogo.titulo}</div>
                        <div class="jogo-meta">${jogo.genero} • ${jogo.ano}</div>
                    </label>
                </div>
            `).join('');

            container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const titulo = e.target.dataset.titulo;
                    if (e.target.checked) selecionados.add(titulo);
                    else selecionados.delete(titulo);
                    atualizarContador();
                });
            });
        }

        function atualizarContador() {
            document.getElementById('total').textContent = selecionados.size;
            document.getElementById('btnOrcamento').disabled = selecionados.size === 0;
        }

        document.getElementById('searchBox').addEventListener('input', (e) => {
            buscar(e.target.value);
        });

        document.getElementById('btnOrcamento').addEventListener('click', () => {
            if (selecionados.size === 0) return;

            const lista = Array.from(selecionados).sort().map((t, i) => `${i + 1}. ${t}`).join('%0A');
            const msg = `Olá! Gostaria de orçamento para um HD com os seguintes ${selecionados.size} jogos:%0A%0A${lista}%0A%0APode me passar a proposta?`;
            const wa_url = `https://wa.me/5541997494895?text=${msg}`;
            window.open(wa_url, '_blank');
        });

        renderGeneros();
        renderJogos();
    </script>
